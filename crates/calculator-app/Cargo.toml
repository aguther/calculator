[package]
name = "calculator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
calculator-core = { path = "../calculator-core" }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland", "accesskit"] }
egui_extras = { version = "=0.33.3", default-features = false, features = ["svg"] }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Navigator", "AudioContext", "OscillatorNode", "GainNode", "AudioNode", "AudioParam", "AudioDestinationNode"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rodio = { version = "=0.21.1", default-features = false, features = ["playback"] }
