[workspace]
members = ["crates/calculator-core", "crates/calculator-app"]
resolver = "2"

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "debuginfo"
