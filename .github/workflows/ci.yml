name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_call:
permissions:
  contents: read
env:
  WRANGLER_SEND_METRICS: 'false'
  CALCULATOR_COMMIT: ${{ github.sha }}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev libdbus-1-dev pkg-config xvfb
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: node scripts/reference-fixtures.cjs --check
      - run: python scripts/test_web.py
      - run: node --test tests/sw.test.cjs
      - run: cargo build --release --locked -p calculator
      - name: Desktop smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo run --release --locked -p calculator --example smoke
      # Hosted Windows runners expose OpenGL 1.1; the real-window smoke test
      # runs locally on Windows and under Xvfb/Mesa on Linux. Windows CI still
      # runs headless egui rendering tests and verifies the executable imports.
      - name: Verify portable Windows binary
        if: runner.os == 'Windows'
        run: python scripts/windows_binary.py target/release/calculator.exe
      - run: python scripts/package.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: rustup show
      - run: cargo install trunk --version 0.21.14 --locked
      - run: cargo clippy --locked -p calculator --target wasm32-unknown-unknown -- -D warnings
      - run: python scripts/build-web.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
