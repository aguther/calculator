name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
env:
  WRANGLER_SEND_METRICS: 'false'
  CALCULATOR_COMMIT: ${{ github.sha }}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dri libwayland-dev libasound2-dev libudev-dev libdbus-1-dev pkg-config xvfb
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: node scripts/reference-fixtures.cjs --check
      - run: python scripts/test_web.py
      - run: node --test tests/sw.test.cjs tests/viewport.test.cjs tests/audio.test.cjs tests/pwa-update.test.cjs
      - run: cargo build --release --locked -p calculator
      - name: Desktop smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a cargo run --release --locked -p calculator --example smoke
      # Hosted Windows runners expose OpenGL 1.1; the real-window smoke test
      # runs locally on Windows and under Xvfb/Mesa on Linux. Windows CI still
      # runs headless egui rendering tests and verifies the executable imports.
      - name: Verify portable Windows binary
        if: runner.os == 'Windows'
        run: python scripts/windows_binary.py target/release/calculator.exe
      - run: python scripts/package.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: rustup show
      - run: cargo install trunk --version 0.21.14 --locked
      - run: cargo clippy --locked -p calculator --target wasm32-unknown-unknown -- -D warnings
      - run: python scripts/build-web.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Software graphics for browser engines
        run: sudo apt-get install -y libgl1-mesa-dri libegl1 libxkbcommon-x11-0 xvfb
      - name: Browser matrix under Xvfb and Mesa
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a npm test
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: web
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-failures
          path: test-results/

  deploy-development:
    name: Deploy main to development
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native, web]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    concurrency:
      group: calculator-development
      cancel-in-progress: true
    environment:
      name: development
      url: https://calculator-dev.andreas-7f3.workers.dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@v8.0.2
        with:
          name: web
          path: dist
      - run: npm ci
      - name: Check this is still the latest main commit
        id: latest
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current" = "$EXPECTED_COMMIT" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping superseded main build.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the verified development build
        if: steps.latest.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --config wrangler.dev.jsonc
      - name: Verify the development address serves this build
        if: steps.latest.outputs.current == 'true'
        run: python scripts/verify-deployment.py https://calculator-dev.andreas-7f3.workers.dev dist/build-info.json
